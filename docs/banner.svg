<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="auto">
  <rect width="800" height="450" fill="#edeaf6" rx="12"/>
  
  <!-- Main content centered -->
  <g transform="translate(400, 210)">
    <!-- "purplle" text -->
    <text x="0" y="0" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-weight="800" 
          font-size="96px" 
          fill="#7a22b4" 
          text-anchor="middle"
          letter-spacing="-3px">purplle</text>
          
    <!-- "store intelligence system" text -->
    <text x="0" y="55" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-weight="400" 
          font-size="34px" 
          fill="#7a22b4" 
          text-anchor="middle">store intelligence system</text>
  </g>
  
  <!-- Footer text right-aligned -->
  <g transform="translate(760, 400)">
    <text x="0" y="0" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-weight="500" 
          font-size="14px" 
          fill="#7a22b4" 
          text-anchor="end">- by Shubham Agarwal</text>
    <text x="0" y="20" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-weight="500" 
          font-size="14px" 
          fill="#7a22b4" 
          text-anchor="end">Intern Applicant</text>
  </g>
</svg>
