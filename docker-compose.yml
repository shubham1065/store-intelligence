version: "3.9"

services:
  api:
    build: .
    container_name: store-intelligence-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      DATABASE_URL: "sqlite:////data/store.db"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout:  5s
      retries:  3
      start_period: 10s