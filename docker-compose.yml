version: "3.9"
services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./data/events.jsonl:/data/events.jsonl
    environment:
      DATABASE_URL: sqlite:////data/store.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3